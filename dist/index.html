const BOSS_W = 96;
const BOSS_H = 84;
const MAX_HP = 20;

// Minion spawned by boss in phase 4
class BossMinion {
  constructor(x, y) {
    this.x = x - 14;
    this.y = y - 36;
    this.w = 28;
    this.h = 36;
    this.vx = 0;
    this.vy = 0;
    this.hp = 2;
    this.dead = false;
    this.invincible = 0;
    this.dir = Math.random() < 0.5 ? -1 : 1;
    this._time = Math.random() * Math.PI * 2;
    this._stomped = false;
  }

  takeDamage(dmg, game) {
    if (this.invincible > 0) return;
    this.hp -= dmg;
    this.invincible = 0.12;
    game.audio.enemyHit();
    if (this.hp <= 0) {
      this.dead = true;
      game.addKill(120, this.x + this.w/2, this.y, '#ff44aa');
      game.audio.enemyDie();
      game.particles.explosion(this.x + this.w/2, this.y + this.h/2, '#ff44aa', 14);
    }
  }

  update(dt, game) {
    this._time += dt;
    this.invincible = Math.max(0, this.invincible - dt);

    const p = game.player;
    const dx = (p.x + p.w/2) - (this.x + this.w/2);
    this.dir = dx > 0 ? 1 : -1;
    this.vx = 160 * this.dir;

    this.vy = Math.min(this.vy + 2400 * dt, 900);
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    const ty = Math.floor((this.y + this.h) / T);
    const tx = Math.floor((this.x + this.w/2) / T);
    const tile = game.level.getTile(tx, ty);
    if (tile === 1 || tile === 2) {
      this.y  = ty * T - this.h;
      this.vy = 0;
    }

    // Clamp to world
    this.x = Math.max(0, Math.min(this.x, game.level.worldW - this.w));

    if (!p.invincible && !p._dying) {
      const hit = p.x < this.x + this.w && p.x + p.w > this.x &&
                  p.y < this.y + this.h && p.y + p.h > this.y;
      if (hit) {
        if (p.vy > 50 && p.y + p.h < this.y + 24) {
          this._stomped = true;
          this.takeDamage(1, game);
          p.stompBounce();
        } else {
          p.hurt(game);
        }
      }
    }

    if (this.y > game.level.worldH + 200) this.dead = true;
  }

  render(ctx) {
    const cx = this.x + this.w/2;
    const cy = this.y + this.h/2;
    const pulse = 0.7 + 0.3 * Math.sin(this._time * 8);

    ctx.save();
    ctx.translate(cx, cy);
    if (this.dir < 0) ctx.scale(-1, 1);

    // Glow
    ctx.globalAlpha = 0.3 * pulse;
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
    g.addColorStop(0, '#ff44aa');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // Body
    ctx.fillStyle = '#55001a';
    ctx.beginPath(); ctx.roundRect(-12, -16, 24, 32, 4); ctx.fill();
    // Head
    ctx.fillStyle = '#880033';
    ctx.beginPath(); ctx.roundRect(-10, -22, 20, 16, 4); ctx.fill();
    // Eye
    ctx.fillStyle = `rgba(255,80,0,${pulse})`;
    ctx.beginPath(); ctx.arc(2, -15, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffff00';
    ctx.beginPath(); ctx.arc(3, -16, 2, 0, Math.PI * 2); ctx.fill();
    // Legs
    ctx.fillStyle = '#440022';
    ctx.fillRect(-8, 14, 7, 12);
    ctx.fillRect(2, 14, 7, 12);

    ctx.restore();
  }
}

class Boss {
  constructor(tx, ty) {
    this.x    = tx * T - BOSS_W/2;
    this.y    = ty * T - BOSS_H + T;
    this.w    = BOSS_W;
    this.h    = BOSS_H;
    this.vx   = 0;
    this.vy   = 0;
    this.dir  = -1;
    this.hp   = MAX_HP;
    this.dead = false;
    this.grounded = false;
    this._prevY = this.y;

    this.invincible = 0;
    this.phase      = 1; // 1-4

    // Attack timers
    this._stompTimer    = 3.0;
    this._shotTimer     = 4.0;
    this._jumpTimer     = 6.0;
    this._hellTimer     = 5.0; // bullet hell (phase 2+)
    this._laserTimer    = 8.0; // laser charge+fire (phase 3+)
    this._teleportTimer = 6.0; // teleport (phase 4)
    this._minionTimer   = 8.0; // minion spawn (phase 4)
    this._stunTimer     = 0;

    // Laser state machine
    this._laserState = null; // null | 'charge' | 'fire'
    this._laserCD    = 0;    // countdown within state
    this._laserY     = 0;
    this._laserX0    = 0;
    this._laserX1    = 3000;

    // Animation
    this._time      = 0;
    this._walkAnim  = 0;
    this._hitFlash  = 0;
    this._enrageFlash = 0;

    // Intro sequence
    this._intro      = true;
    this._introTimer = 2.5;
    this._roarTimer  = 2.0;

    this._pendingSlam = false;
    this._bulletHellRot = 0;
  }

  takeDamage(dmg, game) {
    if (this.invincible > 0 || this._intro) return;
    this.hp = Math.max(0, this.hp - dmg);
    this.invincible = 0.1;
    this._hitFlash  = 0.12;
    game.score += SC_BOSS_HIT;
    game.audio.bossHit();
    game.camera.shake(8);
    game.hitStop(0.04);
    game.flash('#ff6622', 0.15);
    game.particles.explosion(this.x + this.w/2, this.y + this.h/2, '#ff4400', 10);

    // Phase transition
    const newPhase = this.hp <= 3 ? 4 : this.hp <= 8 ? 3 : this.hp <= 14 ? 2 : 1;
    if (newPhase !== this.phase) {
      this.phase = newPhase;
      game.camera.shake(22);
      game.hitStop(0.18);
      game.flash(newPhase === 4 ? '#ff0000' : '#ffaa33', 0.55);
      game.audio.explosion();
      game.particles.explosion(this.x + this.w/2, this.y + this.h/2, '#ff8800', 35);
      game.addFloater(this.x + this.w/2, this.y - 30,
        newPhase === 4 ? '☠ ENRAGE!' : `PHASE ${newPhase}`, '#ff4400');
      // Reset attack timers tighter per phase
      this._stompTimer = 0.5;
      this._shotTimer  = 0.5;
    }

    if (this.hp <= 0) this._die(game);
  }

  _die(game) {
    this.dead = true;
    game._slowMo = 0.2; // dramatic slow-motion
    game.audio.explosion();
    game.camera.shake(28);
    game.hitStop(0.35);
    game.flash('#ffffff', 0.9);
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        if (!game.particles) return;
        game.particles.explosion(
          this.x + rnd(0, this.w),
          this.y + rnd(0, this.h),
          ['#ff4400','#ff8800','#ffcc00','#ffffff'][rndInt(0,3)], 28
        );
        game.camera.shake(12);
      }, i * 180);
    }
    setTimeout(() => { game.triggerWin(); }, 2200);
  }

  update(dt, game) {
    this._time += dt;
    this.invincible = Math.max(0, this.invincible - dt);
    this._hitFlash  = Math.max(0, this._hitFlash  - dt);

    if (this.dead) return;

    // Intro sequence: boss drops in dramatically
    if (this._intro) {
      this._introTimer -= dt;
      this._roarTimer  -= dt;
      if (this._roarTimer > 0) {
        game.camera.shake(4 * (this._roarTimer / 2));
        if (Math.random() < 0.3) game.particles.bossSmoke(this.x + this.w/2, this.y);
      }
      if (this._introTimer <= 0) this._intro = false;
      this._applyGravity(dt);
      this._moveY(game.level, dt);
      return;
    }

    if (this._stunTimer > 0) { this._stunTimer -= dt; return; }

    // Tick all laser state
    this._updateLaser(dt, game);

    // Phase-based speed
    const speed = [0, 90, 130, 160, 200][this.phase] ?? 200;

    // Walk toward player (or teleport in phase 4 — walk is slower between ports)
    const p = game.player;
    const dx = (p.x + p.w/2) - (this.x + this.w/2);
    this.dir = dx > 0 ? 1 : -1;
    this.vx  = speed * this.dir;

    this._walkAnim += dt * (6 + this.phase);

    // Attack timer countdowns (faster in higher phases)
    const pace = this.phase === 4 ? 0.55 : this.phase === 3 ? 0.72 : 1.0;
    this._stompTimer  -= dt;
    this._shotTimer   -= dt;
    this._hellTimer   -= dt;
    this._laserTimer  -= dt;
    this._jumpTimer   -= dt;
    if (this.phase === 4) {
      this._teleportTimer -= dt;
      this._minionTimer   -= dt;
    }

    // Stomp attack (all phases)
    if (this._stompTimer <= 0 && this.grounded) {
      this._doStomp(game);
      this._stompTimer = (2.8 - (this.phase - 1) * 0.45) * pace;
    }

    // Targeted shoot (all phases, escalating spread)
    if (this._shotTimer <= 0) {
      this._doShoot(game);
      this._shotTimer = (2.5 - (this.phase - 1) * 0.35) * pace;
    }

    // Bullet hell ring (phase 2+)
    if (this.phase >= 2 && this._hellTimer <= 0 && this._laserState === null) {
      this._doBulletHell(game);
      this._hellTimer = (4.0 - (this.phase - 2) * 0.6) * pace;
    }

    // Laser (phase 3+)
    if (this.phase >= 3 && this._laserTimer <= 0 && this._laserState === null) {
      this._startLaser(game);
      this._laserTimer = (7.0 - (this.phase - 3) * 1.5) * pace;
    }

    // Jump slam (phase 2+)
    if (this.phase >= 2 && this._jumpTimer <= 0 && this.grounded) {
      this._doJumpSlam(game);
      this._jumpTimer = (4.0 - (this.phase - 2) * 0.5) * pace;
    }

    // Teleport (phase 4)
    if (this.phase === 4 && this._teleportTimer <= 0) {
      this._doTeleport(game);
      this._teleportTimer = 4.5;
    }

    // Minion spawn (phase 4)
    if (this.phase === 4 && this._minionTimer <= 0) {
      this._spawnMinions(game);
      this._minionTimer = 7.0;
    }

    // Physics
    const wasGrounded = this.grounded;
    this._applyGravity(dt);
    this._moveX(game.level, dt);
    this._moveY(game.level, dt);

    if (!wasGrounded && this.grounded && this._pendingSlam) {
      this._pendingSlam = false;
      this._doStomp(game);
    }

    // Phase 3+ smoke trail
    if (this.phase >= 3 && Math.random() < 0.3) {
      game.particles.bossSmoke(this.x + this.w/2, this.y + this.h);
    }

    // Enrage pulse
    if (this.phase === 4) this._enrageFlash = (this._enrageFlash + dt * 6) % (Math.PI * 2);

    // Player contact
    if (!p.invincible && !p._dying &&
        rectOverlap(this.x, this.y, this.w, this.h, p.x, p.y, p.w, p.h)) {
      p.hurt(game);
    }

    // Laser damage check
    if (this._laserState === 'fire') {
      const laserTop = this._laserY - 14;
      const laserBot = this._laserY + 14;
      if (!p.invincible && p.y < laserBot && p.y + p.h > laserTop) {
        p.hurt(game);
      }
    }
  }

  // ── Attack methods ─────────────────────────────────────────────
  _doStomp(game) {
    game.camera.shake(16);
    game.audio.explosion();
    game.flash('#ff8800', 0.12);
    const sy = this.y + this.h - 20;
    const spd = 240 + this.phase * 30;
    game.projectiles.push(new Shockwave(this.x + this.w/2, sy,  1, spd));
    game.projectiles.push(new Shockwave(this.x + this.w/2, sy, -1, spd));
    if (this.phase >= 3) {
      // Extra angled shockwaves
      game.projectiles.push(new Shockwave(this.x + this.w/2, sy,  1, spd * 0.6));
      game.projectiles.push(new Shockwave(this.x + this.w/2, sy, -1, spd * 0.6));
    }
    game.particles.landDust(this.x + this.w/2, this.y + this.h);
    this._stunTimer = 0.4;
  }

  _doShoot(game) {
    const ox  = this.x + (this.dir > 0 ? this.w + 4 : -14);
    const oy  = this.y + 24;
    const p   = game.player;
    // Phase 1: 1 shot. Phase 2: 3-way. Phase 3: 5-way. Phase 4: 7-way ring toward player.
    const count = this.phase === 4 ? 7 : this.phase === 3 ? 5 : this.phase === 2 ? 3 : 1;
    const baseAng = Math.atan2(p.y + p.h/2 - oy, p.x + p.w/2 - ox);
    const totalSpread = this.phase >= 3 ? 1.1 : 0.5;
    const spd = 240 + (this.phase - 1) * 38;
    for (let i = 0; i < count; i++) {
      const ang = count === 1 ? baseAng : baseAng + (i/(count-1) - 0.5) * totalSpread;
      game.projectiles.push(new EnemyBullet(ox, oy, Math.cos(ang)*spd, Math.sin(ang)*spd));
    }
    game.audio.shoot();
  }

  _doBulletHell(game) {
    const cx  = this.x + this.w/2;
    const cy  = this.y + this.h/2;
    const cnt = this.phase >= 4 ? 18 : this.phase === 3 ? 14 : 10;
    const spd = 200 + (this.phase - 2) * 45;
    for (let i = 0; i < cnt; i++) {
      const ang = (i / cnt) * Math.PI * 2 + this._bulletHellRot;
      game.projectiles.push(new EnemyBullet(cx, cy, Math.cos(ang)*spd, Math.sin(ang)*spd));
    }
    this._bulletHellRot += 0.37;
    game.audio.explosion();
    game.flash('#ff2200', 0.1);
    game.particles.explosion(cx, cy, '#ff4400', 12);
  }

  _startLaser(game) {
    this._laserState = 'charge';
    this._laserCD    = 1.2;
    this._laserY     = game.player.y + game.player.h/2;
    this._laserX0    = 0;
    this._laserX1    = game.level.worldW;
    game.camera.shake(5);
  }

  _updateLaser(dt, game) {
    if (!this._laserState) return;
    this._laserCD -= dt;

    if (this._laserState === 'charge') {
      // Track player Y during charge
      const p = game.player;
      this._laserY = this._laserY * 0.95 + (p.y + p.h/2) * 0.05;
      if (this._laserCD <= 0) {
        this._laserState = 'fire';
        this._laserCD    = 0.55;
        game.camera.shake(16);
        game.flash('#ff0000', 0.4);
        game.audio.explosion();
      }
    } else if (this._laserState === 'fire') {
      if (this._laserCD <= 0) {
        this._laserState = null;
      }
    }
  }

  _doJumpSlam(game) {
    this.vy = -720;
    this.grounded = false;
    game.camera.shake(8);
    this._pendingSlam = true;
  }

  _doTeleport(game) {
    const level = game.level;
    // Flash at old position
    game.particles.explosion(this.x + this.w/2, this.y + this.h/2, '#aa00ff', 22);
    game.flash('#aa00ff', 0.2);
    game.audio.doubleJump(); // reuse sound for warp effect

    // Pick new position near ground on opposite side
    const newX = this.dir > 0
      ? rnd(level.worldW * 0.05, level.worldW * 0.35)
      : rnd(level.worldW * 0.55, level.worldW * 0.88);
    this.x = newX;
    this.vy = 0;

    // Flash at new position
    game.particles.explosion(this.x + this.w/2, this.y + this.h/2, '#ff00ff', 22);
    game.camera.shake(10);
    this.invincible = 0.5;
  }

  _spawnMinions(game) {
    const count = this.phase === 4 ? 3 : 2;
    for (let i = 0; i < count; i++) {
      const mx = this.x + this.w/2 + (i - 1) * 80;
      game.enemies.push(new BossMinion(mx, this.y + this.h));
    }
    game.particles.explosion(this.x + this.w/2, this.y + this.h/2, '#ff44aa', 16);
    game.audio.enemyDie(); // reuse for spawn sound
  }

  _applyGravity(dt) { this.vy = Math.min(this.vy + 2200 * dt, 900); }

  _moveX(level, dt) {
    this.x += this.vx * dt;
    const tx0 = Math.floor(this.x / T);
    const tx1 = Math.floor((this.x + this.w - 1) / T);
    const ty0 = Math.floor(this.y / T);
    const ty1 = Math.floor((this.y + this.h - 1) / T);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        if (level.getTile(tx, ty) !== 1) continue;
        const tileX = tx * T;
        if (this.vx > 0 && this.x + this.w > tileX) {
          this.x = tileX - this.w; this.vx = 0; this.dir = -1;
        } else if (this.vx < 0 && this.x < tileX + T) {
          this.x = tileX + T; this.vx = 0; this.dir = 1;
        }
      }
    }
  }

  _moveY(level, dt) {
    this._prevY = this.y;
    this.y += this.vy * dt;
    this.grounded = false;
    const tx0 = Math.floor(this.x / T);
    const tx1 = Math.floor((this.x + this.w - 1) / T);
    const ty0 = Math.floor(this.y / T);
    const ty1 = Math.floor((this.y + this.h - 1) / T);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const tile = level.getTile(tx, ty);
        if (tile !== 1) continue;
        const tileY = ty * T;
        if (this.vy > 0 && this.y + this.h > tileY && this._prevY + this.h <= tileY + 1) {
          this.y = tileY - this.h; this.vy = 0; this.grounded = true;
        }
        if (this.vy < 0 && this.y < tileY + T && this._prevY >= tileY + T) {
          this.y = tileY + T; this.vy = 0;
        }
      }
    }
  }

  render(ctx) {
    if (this.dead) return;

    // Laser telegraph / fire (world-space, behind boss)
    this._renderLaser(ctx);

    const flash = this._hitFlash > 0;
    if (flash && Math.floor(this._hitFlash * 25) % 2 === 0) ctx.globalAlpha = 0.5;

    const cx   = this.x + this.w/2;
    const cy   = this.y + this.h/2;
    const walk = Math.sin(this._walkAnim) * 3;

    // Phase aura
    const phaseHue = this.phase === 1 ? 220 : this.phase === 2 ? 30 : this.phase === 3 ? 0 : 330;
    const enrPulse = this.phase === 4 ? 0.3 + 0.7 * Math.abs(Math.sin(this._enrageFlash)) : 0.2;
    ctx.globalAlpha = enrPulse;
    const aura = ctx.createRadialGradient(cx, cy, 10, cx, cy, 80);
    aura.addColorStop(0, `hsl(${phaseHue},100%,60%)`);
    aura.addColorStop(1, 'transparent');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(cx, cy, 80, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(cx, cy + walk);
    if (this.dir < 0) ctx.scale(-1, 1);

    // Legs
    ctx.fillStyle = '#333355';
    for (let i = 0; i < 4; i++) {
      const lx       = -40 + i * 26;
      const legPhase = Math.sin(this._walkAnim + i * 1.2) * 8;
      ctx.fillRect(lx, 28, 12, 22 + legPhase);
      ctx.fillStyle = '#555577';
      ctx.fillRect(lx - 4, 48 + legPhase, 20, 8);
      ctx.fillStyle = '#333355';
    }

    // Body (enrage flickers red)
    const bodyColor0 = this.phase === 4 ? `hsl(${350 + 10 * Math.sin(this._enrageFlash)},80%,25%)` : '#444466';
    const bodyGrad = ctx.createLinearGradient(-40, -32, 40, 32);
    bodyGrad.addColorStop(0, bodyColor0);
    bodyGrad.addColorStop(0.5, '#222244');
    bodyGrad.addColorStop(1, '#111133');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.roundRect(-44, -28, 88, 60, 12); ctx.fill();

    // Armour plates
    ctx.fillStyle = '#333355';
    ctx.fillRect(-44, -28, 88, 14);
    ctx.fillRect(-44, 18, 88, 14);

    // Rivets
    ctx.fillStyle = '#555588';
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.arc(i * 12, -22, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(i * 12, 24, 3, 0, Math.PI * 2); ctx.fill();
    }

    // Shoulder cannons (phase 2+)
    if (this.phase >= 2) {
      ctx.fillStyle = '#442200';
      ctx.fillRect(28, -38, 28, 14);
      ctx.fillStyle = '#331100';
      ctx.beginPath(); ctx.arc(56, -31, 8, 0, Math.PI * 2); ctx.fill();
      const cg = 0.5 + 0.5 * Math.sin(this._time * 8);
      ctx.fillStyle = `rgba(255,${this.phase >= 3 ? 50 : 100},0,${cg})`;
      ctx.beginPath(); ctx.arc(56, -31, 5, 0, Math.PI * 2); ctx.fill();
    }

    // Phase 4: extra shoulder spikes
    if (this.phase === 4) {
      ctx.fillStyle = '#ff0033';
      for (let i = -1; i <= 1; i += 2) {
        ctx.save();
        ctx.translate(i * 44, -28);
        ctx.rotate(i * 0.4);
        ctx.fillRect(-4, -18, 8, 20);
        ctx.restore();
      }
    }

    // Head
    const headGrad = ctx.createRadialGradient(-6, -46, 4, 0, -44, 24);
    headGrad.addColorStop(0, '#555577');
    headGrad.addColorStop(1, '#222244');
    ctx.fillStyle = headGrad;
    ctx.beginPath(); ctx.roundRect(-24, -60, 48, 36, 8); ctx.fill();

    // Visor
    ctx.fillStyle = '#110022';
    ctx.fillRect(-20, -54, 40, 16);

    // Eye — color shifts with phase
    const eyeGlow = 0.6 + 0.4 * Math.sin(this._time * (6 + this.phase * 2));
    const eyeHue  = this.phase === 4 ? `hsl(0,100%,${50+30*eyeGlow}%)` :
                    this.phase === 3 ? '#ff4400' :
                    this.phase === 2 ? '#ff8800' : '#00aaff';
    ctx.fillStyle = eyeHue;
    ctx.fillRect(-16, -52, 32, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(0, -46, 5 * eyeGlow, 0, Math.PI * 2); ctx.fill();

    ctx.restore();

    // HP bar
    const barW  = this.w * 1.3;
    const barX  = this.x + this.w/2 - barW/2;
    const barY  = this.y - 28;
    ctx.fillStyle = '#330000';
    ctx.fillRect(barX, barY, barW, 12);
    const hpFrac  = this.hp / MAX_HP;
    const barColor = hpFrac > 0.5 ? '#00ff44' : hpFrac > 0.25 ? '#ffaa00' : '#ff2200';
    ctx.fillStyle = barColor;
    ctx.fillRect(barX, barY, barW * hpFrac, 12);
    // Phase dividers
    for (const frac of [14/20, 8/20, 3/20]) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(barX + barW * frac - 1, barY, 2, 12);
    }
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, 12);

    const bossLabel = this.phase === 4 ? '☠ MECH-REX ENRAGED' :
                      this.phase === 3 ? '⚡ MECH-REX' :
                      this.phase === 2 ? '🔥 MECH-REX' : 'MECH-REX';
    ctx.fillStyle = this.phase === 4 ? '#ff4444' : '#ffffff';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(bossLabel, this.x + this.w/2, barY - 5);

    ctx.globalAlpha = 1;
  }

  _renderLaser(ctx) {
    if (!this._laserState) return;
    const x0 = this._laserX0;
    const x1 = this._laserX1;
    const y  = this._laserY;

    if (this._laserState === 'charge') {
      const progress = 1 - this._laserCD / 1.2;
      ctx.globalAlpha = 0.15 + progress * 0.5;
      ctx.strokeStyle = '#ff2200';
      ctx.lineWidth = 2 + progress * 6;
      ctx.setLineDash([12, 8]);
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x1, y);
      ctx.stroke();
      ctx.setLineDash([]);
      // Warning triangles
      for (let x = x0 + 40; x < x1; x += 120) {
        ctx.fillStyle = `rgba(255,80,0,${0.4 * progress})`;
        ctx.beginPath();
        ctx.moveTo(x, y - 14);
        ctx.lineTo(x + 10, y);
        ctx.lineTo(x - 10, y);
        ctx.closePath();
        ctx.fill();
      }
    } else if (this._laserState === 'fire') {
      const pulse = 0.85 + 0.15 * Math.sin(this._time * 30);
      // Outer glow
      ctx.globalAlpha = 0.5;
      const laserGrad = ctx.createLinearGradient(0, y - 22, 0, y + 22);
      laserGrad.addColorStop(0, 'transparent');
      laserGrad.addColorStop(0.5, '#ff2200');
      laserGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = laserGrad;
      ctx.fillRect(x0, y - 22, x1 - x0, 44);
      // Core beam
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ff6600';
      ctx.fillRect(x0, y - 10, x1 - x0, 20);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x0, y - 4, x1 - x0, 8);
    }

    ctx.globalAlpha = 1;
  }
}


// ===================== Player.js =====================




class Player {
  constructor(tx, ty) {
    this.x = tx * T;
    this.y = ty * T;
    this.w = PW;
    this.h = PH;
    this.vx = 0;
    this.vy = 0;

    this.grounded     = false;
    this.facingRight  = true;
    this._coyote      = 0;
    this._jumpBuf     = 0;
    this._jumpHeld    = 0;
    this._wasGrounded = false;
    this._prevY       = 0;

    this.invincible = false;
    this._invTimer  = 0;

    // Power-ups: name → remaining seconds (multiple active simultaneously)
    this.power = {};  // rapidFire | spread | shield | doubleJump | magnet | speed
    this._hasJumped2 = false;

    this._shootTimer = 0;

    // Dash — core ability, always available (Shift key)
    this._dashCD    = 0;
    this._dashTimer = 0;
    this.dashing    = false;
    this._dashDir   = 1;

    // Animation
    this._animTime  = 0;
    this._animFrame = 0;
    this._shootAnim = 0;
    this._hurtFlash = 0;
    this._landAnim  = 0;
    this._deathAnim = 0;

    this.dead   = false;
    this._dying = false;

    // Speed afterimage trail
    this._ghosts     = [];
    this._ghostTimer = 0;
  }

  hurt(game) {
    if (this.invincible || this._dying) return;

    if (this.power.shield > 0) {
      delete this.power.shield;
      game.audio.collectPowerup();
      game.particles.explosion(this.x + this.w/2, this.y + this.h/2, '#0066ff', 14);
      game.camera.shake(6);
      game.flash('#4488ff', 0.4);
      return;
    }

    game.lives--;
    game.audio.playerHurt();
    game.camera.shake(14);
    game.flash('#ff2222', 0.35);
    game.particles.hurt(this.x + this.w/2, this.y + this.h/2);

    this.invincible = true;
    this._invTimer  = INVINCIBLE_T;
    this._hurtFlash = 0;
    this.vy = -300;
    this.vx = this.facingRight ? -150 : 150;

    if (game.lives <= 0) {
      this._dying     = true;
      this._deathAnim = 0;
    }
  }

  update(dt, game) {
    const inp = game.input;

    if (this._dying) {
      this._deathAnim += dt;
      this.vy += GRAVITY * dt;
      this.y  += this.vy * dt;
      if (this._deathAnim > 1.5) this.dead = true;
      return;
    }

    this._prevY = this.y;

    // Decay all power-up timers simultaneously
    for (const key of Object.keys(this.power)) {
      this.power[key] -= dt;
      if (this.power[key] <= 0) delete this.power[key];
    }

    // Invincibility
    if (this.invincible) {
      this._invTimer  -= dt;
      this._hurtFlash += dt;
      if (this._invTimer <= 0) this.invincible = false;
    }

    // Shoot cooldown
    this._shootTimer = Math.max(0, this._shootTimer - dt);

    // ── Dash (Shift key, always available) ───────────────────────
    this._dashCD = Math.max(0, this._dashCD - dt);
    if (inp.dash() && this._dashCD <= 0 && this._dashTimer <= 0) {
      this._dashDir   = this.facingRight ? 1 : -1;
      this._dashTimer = DASH_DUR;
      this._dashCD    = DASH_CD;
      this.dashing    = true;
      this.invincible = true;
      this._invTimer  = Math.max(this._invTimer, DASH_DUR + 0.06);
      game.particles.explosion(this.x + this.w/2, this.y + this.h/2, '#00ddff', 10);
      game.flash('#00ddff', 0.08);
    }

    if (this._dashTimer > 0) {
      this._dashTimer -= dt;
      this.vy  = 0;
      this.vx  = this._dashDir * DASH_SPD;
      if (this._dashTimer <= 0) {
        this.dashing = false;
        this.vx = this._dashDir * 220;
      }
    }

    // ── Horizontal movement ───────────────────────────────────────
    if (!this.dashing) {
      const spd = PLAYER_SPEED * (this.power.speed > 0 ? 1.65 : this.power.rapidFire > 0 ? 1.3 : 1);
      if (inp.left()) {
        this.vx = clamp(this.vx - PLAYER_ACCEL * dt, -spd, spd);
        this.facingRight = false;
      } else if (inp.right()) {
        this.vx = clamp(this.vx + PLAYER_ACCEL * dt, -spd, spd);
        this.facingRight = true;
      } else {
        if (Math.abs(this.vx) < 20) this.vx = 0;
        else this.vx -= sign(this.vx) * PLAYER_DECEL * dt;
      }
    }

    // ── Jump input ────────────────────────────────────────────────
    if (inp.jumpPressed()) this._jumpBuf = JUMP_BUF_T;
    if (this._jumpBuf > 0) this._jumpBuf -= dt;

    const canJump = this.grounded || this._coyote > 0;

    if (this._jumpBuf > 0 && canJump) {
      this.vy = JUMP_VEL;
      this._jumpBuf    = 0;
      this._coyote     = 0;
      this._jumpHeld   = 0;
      this._hasJumped2 = false;
      game.audio.jump();
      game.particles.jumpDust(this.x + this.w/2, this.y + this.h);
    } else if (inp.jumpPressed() && !canJump && this.power.doubleJump > 0 && !this._hasJumped2) {
      this.vy = JUMP_VEL * 0.9;
      this._hasJumped2 = true;
      game.audio.doubleJump();
      game.particles.explosion(this.x + this.w/2, this.y + this.h, '#aa44ff', 10);
    }

    if (inp.jump() && this.vy < 0) {
      this._jumpHeld += dt;
      if (this._jumpHeld < JUMP_HOLD_MAX) {
        this.vy += GRAVITY * (JUMP_HOLD_REDUCE - 1) * dt;
      }
    } else if (inp.jumpReleased()) {
      this._jumpHeld = JUMP_HOLD_MAX;
    }

    // ── Shooting ──────────────────────────────────────────────────
    const cd = this.power.rapidFire > 0 ? SHOOT_CD_RAPID : SHOOT_CD;
    if (inp.shoot() && this._shootTimer <= 0) {
      this._shootTimer = cd;
      this._shootAnim  = 0.12;
      const bx  = this.facingRight ? this.x + this.w : this.x - 20;
      const by  = this.y + this.h * 0.35;
      const dir = this.facingRight ? 1 : -1;
      if (this.power.spread > 0) {
        for (let i = -1; i <= 1; i++) {
          game.projectiles.push(new PlayerBolt(bx, by, dir, i * 0.32 * PROJ_SPEED));
        }
      } else {
        game.projectiles.push(new PlayerBolt(bx, by, dir, 0));
      }
      game.audio.shoot();
    }

    // ── Gravity ───────────────────────────────────────────────────
    if (!this.dashing) {
      this.vy = clamp(this.vy + GRAVITY * dt, -9999, MAX_FALL);
    }

    // ── Coyote time ───────────────────────────────────────────────
    if (this.grounded) this._coyote = COYOTE_T;
    else if (this._coyote > 0) this._coyote -= dt;

    const wasGrounded = this.grounded;
    this.grounded = false;

    // ── Move & collide (X then Y) ─────────────────────────────────
    this.x += this.vx * dt;
    this._resolveX(game.level);

    this.y += this.vy * dt;
    this._resolveY(game.level, wasGrounded, dt);

    // Clamp to world
    this.x = clamp(this.x, 0, game.level.worldW - this.w);
    if (this.y > game.level.worldH + 100) {
      this.hurt(game);
      this.x  = game._spawnX;
      this.y  = game._spawnY;
      this.vx = 0; this.vy = 0;
    }

    // Land effect
    if (!wasGrounded && this.grounded && this.vy >= -1) {
      this._landAnim = 0.15;
      game.audio.land();
      game.particles.landDust(this.x + this.w/2, this.y + this.h);
    }

    // ── Animation ─────────────────────────────────────────────────
    this._animTime += dt;
    this._shootAnim = Math.max(0, this._shootAnim - dt * 2);
    this._landAnim  = Math.max(0, this._landAnim  - dt * 4);

    if (this.grounded && Math.abs(this.vx) > 20) {
      const rate = Math.abs(this.vx) / PLAYER_SPEED;
      if (this._animTime > 0.1 / rate) {
        this._animTime = 0;
        this._animFrame = (this._animFrame + 1) % 4;
      }
    } else if (!this.grounded) {
      this._animFrame = 4;
    } else {
      this._animFrame = 0;
    }

    // Ghost trail (speed afterimage + dash)
    if (this.dashing || Math.abs(this.vx) > PLAYER_SPEED * 0.82) {
      this._ghostTimer -= dt;
      if (this._ghostTimer <= 0) {
        this._ghostTimer = this.dashing ? 0.022 : 0.045;
        this._ghosts.push({ x: this.x, y: this.y, life: 0.28, max: 0.28, dash: this.dashing });
      }
    }
    for (const g of this._ghosts) g.life -= dt;
    this._ghosts = this._ghosts.filter(g => g.life > 0);
  }

  _resolveX(level) {
    const tx0 = Math.floor(this.x / T);
    const tx1 = Math.floor((this.x + this.w - 1) / T);
    const ty0 = Math.floor(this.y / T);
    const ty1 = Math.floor((this.y + this.h - 1) / T);

    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const tile = level.getTile(tx, ty);
        if (tile !== 1) continue;
        const tileX = tx * T;
        if (this.vx > 0 && this.x + this.w > tileX && this.x < tileX) {
          this.x  = tileX - this.w; this.vx = 0;
        }
        if (this.vx < 0 && this.x < tileX + T && this.x + this.w > tileX + T) {
          this.x  = tileX + T; this.vx = 0;
        }
      }
    }
  }

  _resolveY(level, wasGrounded, dt = 0) {
    const tx0 = Math.floor(this.x / T);
    const tx1 = Math.floor((this.x + this.w - 1) / T);
    const ty0 = Math.floor(this.y / T);
    const ty1 = Math.floor((this.y + this.h - 1) / T);

    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const tile = level.getTile(tx, ty);
        if (tile === 0) continue;
        const tileY = ty * T;

        if (tile === 1) {
          if (this.vy > 0 && this.y + this.h > tileY && this._prevY + this.h <= tileY + 1) {
            this.y = tileY - this.h; this.vy = 0; this.grounded = true;
          }
          if (this.vy < 0 && this.y < tileY + T && this._prevY >= tileY + T) {
            this.y = tileY + T; this.vy = 0;
          }
        } else if (tile === 2) {
          if (this.vy > 0 && this.y + this.h > tileY && this._prevY + this.h <= tileY + 2) {
            this.y = tileY - this.h; this.vy = 0; this.grounded = true;
          }
        }
      }
    }

    for (const mp of level.movingPlatforms) {
      if (this.vy >= 0 &&
          this.x + this.w > mp.x && this.x < mp.x + mp.w &&
          this.y + this.h > mp.y && this._prevY + this.h <= mp.y + 4) {
        this.y       = mp.y - this.h;
        this.vy      = 0;
        this.grounded = true;
        if (mp.axis === 'x') this.x += mp.vx * dt;
      }
    }
  }

  stompBounce() { this.vy = STOMP_BOUNCE; }

  render(ctx) {
    if (this._dying) { this._renderDying(ctx); return; }

    // Speed afterimages
    for (const g of this._ghosts) {
      const a = (g.life / g.max) * 0.42;
      ctx.globalAlpha = a;
      ctx.fillStyle = g.dash ? '#ff44ff' : '#00ddff';
      ctx.beginPath();
      ctx.roundRect(g.x + 2, g.y + 8, this.w - 4, this.h - 14, 8);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Invincibility blink
    if (this.invincible && Math.floor(this._hurtFlash * 12) % 2 === 0) return;

    const cx = this.x + this.w / 2;
    const cy = this.y + this.h / 2;

    // Squash/stretch
    const landSq  = this._landAnim / 0.15;
    const scaleX  = 1 + landSq * 0.25;
    const scaleY  = 1 - landSq * 0.2;
    const jumpStr = !this.grounded && this.vy < 0 ? 0.12 : 0;
    const totalSX = scaleX + jumpStr * -0.1;
    const totalSY = scaleY + jumpStr * 0.12;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(totalSX, totalSY);
    if (!this.facingRight) ctx.scale(-1, 1);
    this._drawBody(ctx);
    ctx.restore();

    // Dash aura
    if (this.dashing) {
      ctx.globalAlpha = 0.5;
      const dg = ctx.createRadialGradient(cx, cy, 4, cx, cy, 36);
      dg.addColorStop(0, '#ff44ff');
      dg.addColorStop(1, 'transparent');
      ctx.fillStyle = dg;
      ctx.beginPath(); ctx.arc(cx, cy, 36, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Speed power aura
    if (this.power.speed > 0) {
      const pulse = 0.7 + 0.3 * Math.sin(Date.now() * 0.01);
      ctx.globalAlpha = 0.28 * pulse;
      const sg = ctx.createRadialGradient(cx, cy, 6, cx, cy, 38);
      sg.addColorStop(0, '#ffee00');
      sg.addColorStop(1, 'transparent');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(cx, cy, 38, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Shield aura
    if (this.power.shield > 0) {
      const pulse = 0.7 + 0.3 * Math.sin(Date.now() * 0.006);
      ctx.globalAlpha = 0.35 * pulse;
      const sg = ctx.createRadialGradient(cx, cy, 10, cx, cy, 32);
      sg.addColorStop(0, '#4488ff');
      sg.addColorStop(1, 'transparent');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(cx, cy, 32, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#88aaff';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6 * pulse;
      ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Magnet field
    if (this.power.magnet > 0) {
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.008);
      ctx.globalAlpha = 0.18 * pulse;
      ctx.strokeStyle = '#ff44ff';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.arc(cx, cy, 160, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // Dash cooldown indicator (small arc below player)
    if (this._dashCD > 0) {
      const frac = 1 - this._dashCD / DASH_CD;
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, this.y + this.h + 6, 10, -Math.PI/2, -Math.PI/2 + frac * Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  _drawBody(ctx) {
    const f     = this._animFrame;
    const shoot = this._shootAnim > 0;

    // Shadow
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(0, PH/2 + 4, PW/2 + 2, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Aura glow
    const aura = ctx.createRadialGradient(0, 0, 4, 0, 0, 28);
    aura.addColorStop(0, 'rgba(0,200,255,0.22)');
    aura.addColorStop(1, 'rgba(0,100,255,0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();

    // Legs
    ctx.fillStyle = '#006699';
    const legY   = PH/2 - 4;
    const legOff = [0, 6, 0, -6][f % 4];
    ctx.fillRect(-14, legY + legOff, 10, 12);
    ctx.fillRect(  4, legY - legOff, 10, 12);

    // Body
    const bodyGrad = ctx.createLinearGradient(-PW/2, -PH/2, PW/2, PH/2);
    bodyGrad.addColorStop(0, '#00ddff');
    bodyGrad.addColorStop(0.5, '#0099cc');
    bodyGrad.addColorStop(1, '#005588');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.roundRect(-PW/2 + 2, -PH/2 + 8, PW - 4, PH - 14, 8);
    ctx.fill();

    // Chest highlight
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.ellipse(-4, -PH/2 + 18, 8, 12, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Arms
    ctx.fillStyle = '#0088bb';
    const armY = -PH/2 + 20;
    if (shoot) {
      ctx.fillRect(PW/2 - 2, armY - 3, 18, 8);
      ctx.fillStyle = '#00ffff';
      ctx.beginPath(); ctx.arc(PW/2 + 16, armY + 1, 5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillRect(PW/2 - 2, armY, 10, 7);
    }
    ctx.fillStyle = '#0088bb';
    ctx.fillRect(-PW/2 - 8, armY, 10, 7);

    // Head
    const headGrad = ctx.createRadialGradient(-3, -PH/2 - 2, 3, 0, -PH/2, 14);
    headGrad.addColorStop(0, '#44eeff');
    headGrad.addColorStop(1, '#007799');
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.arc(0, -PH/2 + 4, 14, 0, Math.PI * 2);
    ctx.fill();

    // Helmet ridge
    ctx.fillStyle = '#00aabb';
    ctx.fillRect(-6, -PH/2 - 4, 12, 6);
    ctx.beginPath(); ctx.arc(0, -PH/2 - 4, 6, Math.PI, 0); ctx.fill();

    // Eyes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(5, -PH/2 + 2, 4.5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-5, -PH/2 + 2, 3.5, 4, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#001133';
    ctx.beginPath(); ctx.arc(6, -PH/2 + 3, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-4.5, -PH/2 + 3, 2, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(100,220,255,0.8)';
    ctx.beginPath(); ctx.arc(7, -PH/2 + 1, 1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-3.5, -PH/2 + 1, 0.8, 0, Math.PI * 2); ctx.fill();

    // Energy core
    const t = Date.now() * 0.003;
    ctx.fillStyle = `hsl(${190 + Math.sin(t)*20},100%,65%)`;
    ctx.beginPath(); ctx.arc(0, -4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-1, -5, 2, 0, Math.PI * 2); ctx.fill();
  }

  _renderDying(ctx) {
    const t  = Math.min(this._deathAnim / 1.5, 1);
    const cx = this.x + this.w / 2;
    const cy = this.y + this.h / 2;
    ctx.globalAlpha = 1 - t;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * Math.PI * 4);
    ctx.scale(1 - t * 0.5, 1 - t * 0.5);
    this._drawBody(ctx);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}


// ===================== Checkpoint.js =====================



const SAVE_KEY = 'nebulaDash_checkpoint';

function saveCheckpoint(game, checkpointId) {
  try {
    const data = {
      levelIndex:   game.currentLevelIndex,
      score:        game.score,
      lives:        game.lives,
      checkpointId,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (_) { /* incognito / storage full */ }
}

function loadCheckpoint() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

function clearCheckpoint() {
  try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
}

class Checkpoint {
  constructor(tx, ty, id) {
    this.x    = tx * T;
    this.y    = ty * T - T;            // stands 1 tile tall, sits on the tile row
    this.w    = T * 0.6;
    this.h    = T * 1.6;
    this.id   = id;
    this._triggered = false;
    this._time = Math.random() * Math.PI * 2;
    this._activateAnim = 0;
  }

  update(dt, game) {
    this._time += dt * 2;
    if (this._activateAnim > 0) this._activateAnim = Math.max(0, this._activateAnim - dt * 2);

    if (!this._triggered) {
      const p = game.player;
      if (rectOverlap(this.x - 8, this.y, this.w + 16, this.h, p.x, p.y, p.w, p.h)) {
        this._triggered = true;
        this._activateAnim = 1;

        // Update spawn point
        game._spawnX = this.x;
        game._spawnY = this.y;

        // Persist to localStorage
        saveCheckpoint(game, this.id);

        // Juice
        game.audio.collectPowerup();
        game.particles.explosion(this.x + this.w/2, this.y + this.h/2, '#00ffcc', 20);
        game.addFloater(this.x + this.w/2, this.y - 10, '✓ CHECKPOINT', '#00ffcc');
        game.camera.shake(4);
        game.flash('#00ffcc', 0.18);
      }
    }
  }

  render(ctx) {
    const cx   = this.x + this.w/2;
    const t    = this._time;
    const act  = this._triggered;
    const pop  = this._activateAnim;
    const color = act ? '#00ffcc' : '#888888';
    const gAlpha = act ? 0.35 + 0.15 * Math.sin(t) : 0.12;

    // Pillar glow
    ctx.globalAlpha = gAlpha;
    const glow = ctx.createRadialGradient(cx, this.y + this.h/2, 4, cx, this.y + this.h/2, 36);
    glow.addColorStop(0, color);
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, this.y + this.h/2, 36, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // Pillar shaft
    const shaftGrad = ctx.createLinearGradient(this.x, 0, this.x + this.w, 0);
    shaftGrad.addColorStop(0, act ? '#005533' : '#333333');
    shaftGrad.addColorStop(0.5, act ? '#00aa66' : '#555555');
    shaftGrad.addColorStop(1, act ? '#005533' : '#333333');
    ctx.fillStyle = shaftGrad;
    ctx.fillRect(this.x + this.w * 0.2, this.y + 12, this.w * 0.6, this.h - 12);

    // Base platform
    ctx.fillStyle = act ? '#00664d' : '#444444';
    ctx.beginPath();
    ctx.roundRect(this.x, this.y + this.h - 10, this.w, 10, 3);
    ctx.fill();

    // Top orb
    const orbY   = this.y + 8 + (act ? Math.sin(t) * 4 : 0);
    const orbR   = act ? 10 + pop * 6 : 8;
    const orbAlpha = act ? 0.9 : 0.4;
    ctx.globalAlpha = orbAlpha;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, orbY, orbR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(cx - 3, orbY - 3, orbR * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // Orbiting sparks when active
    if (act) {
      for (let i = 0; i < 3; i++) {
        const a  = t * 2 + (i / 3) * Math.PI * 2;
        const sx = cx + Math.cos(a) * 16;
        const sy = orbY + Math.sin(a) * 7;
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // Label
    ctx.fillStyle = act ? 'rgba(0,255,200,0.8)' : 'rgba(150,150,150,0.5)';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SAVE', cx, this.y + this.h - 4);
  }
}

class MovingPlatform {
  constructor(data) {
    const { tx, ty, w, speed, range, axis } = data;
    this.w     = w * T;
    this.h     = T;
    this.x     = tx * T;
    this.y     = ty * T;
    this._ox   = this.x;
    this._oy   = this.y;
    this.speed = speed;
    this.range = range * T;
    this.axis  = axis;
    this._dir  = 1;
    this._t    = 0;
    this.vx    = 0;
    this.vy    = 0;
  }

  update(dt) {
    const prev = this.axis === 'x' ? this.x : this.y;
    this._t += this.speed * dt * this._dir;
    if (Math.abs(this._t) >= this.range) {
      this._dir = -this._dir;
      this._t = Math.sign(this._t) * this.range;
    }
    if (this.axis === 'x') {
      this.x  = this._ox + this._t;
      this.vx = (this.x - prev) / dt;
      this.vy = 0;
    } else {
      this.y  = this._oy + this._t;
      this.vy = (this.y - prev) / dt;
      this.vx = 0;
    }
  }

  render(ctx) {
    const grd = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
    grd.addColorStop(0, '#44ffaa');
    grd.addColorStop(1, '#007733');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.roundRect(this.x + 2, this.y + 2, this.w - 4, this.h - 4, 4);
    ctx.fill();

    ctx.strokeStyle = '#88ffcc';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(this.x + 2, this.y + 2, this.w - 4, this.h - 4, 4);
    ctx.stroke();

    // Animated energy pulse
    const t = Date.now() * 0.002;
    ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t + this.x * 0.01);
    ctx.fillStyle = '#aaffdd';
    ctx.fillRect(this.x + 2, this.y + 2, this.w - 4, 4);
    ctx.globalAlpha = 1;
  }
}

class Level {
  constructor(data) {
    this.data      = data;
    this.tileW     = data.tileW;
    this.tileH     = data.tileH;
    this.worldW    = data.tileW * T;
    this.worldH    = data.tileH * T;

    // Build tile map
    this._tiles = new Uint8Array(this.tileW * this.tileH);
    for (const { x, y, type } of data.tiles) {
      if (x >= 0 && x < this.tileW && y >= 0 && y < this.tileH)
        this._tiles[y * this.tileW + x] = type;
    }

    this.movingPlatforms = (data.movingPlatforms || []).map(d => new MovingPlatform(d));

    // Exit flag position
    this.exitX = data.exit ? data.exit.tx * T + T / 2 : -9999;
    this.exitY = data.exit ? data.exit.ty * T : -9999;
  }

  static buildEntities(data) {
    const enemies     = [];
    const collectibles = [];
    let boss = null;

    for (const e of (data.enemies || [])) {
      switch (e.type) {
        case 'crawler': enemies.push(new Crawler(e.tx, e.ty)); break;
        case 'bouncer': enemies.push(new Bouncer(e.tx, e.ty)); break;
        case 'shooter': enemies.push(new Shooter(e.tx, e.ty)); break;
        case 'flyer':   enemies.push(new Flyer(e.tx, e.ty));   break;
      }
    }
    for (const c of (data.crystals || []))  collectibles.push(new Crystal(c.tx, c.ty));
    for (const p of (data.powerUps || []))  collectibles.push(new PowerUp(p.tx, p.ty, p.type));
    if (data.boss) boss = new Boss(data.boss.tx, data.boss.ty);

    const checkpoints = (data.checkpoints || []).map((cp, i) => new Checkpoint(cp.tx, cp.ty, i));
    return { enemies, collectibles, boss, checkpoints };
  }

  getTile(tx, ty) {
    if (tx < 0 || tx >= this.tileW || ty < 0 || ty >= this.tileH) return 0;
    return this._tiles[ty * this.tileW + tx];
  }

  // Returns true if any solid/spike tile covers the rect
  solidAt(rx, ry, rw, rh) {
    const tx0 = Math.floor(rx / T);
    const tx1 = Math.floor((rx + rw - 1) / T);
    const ty0 = Math.floor(ry / T);
    const ty1 = Math.floor((ry + rh - 1) / T);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const t = this.getTile(tx, ty);
        if (t === 1) return true;
      }
    }
    return false;
  }

  // Check spikes
  spikeAt(rx, ry, rw, rh) {
    const tx0 = Math.floor(rx / T);
    const tx1 = Math.floor((rx + rw - 1) / T);
    const ty0 = Math.floor(ry / T);
    const ty1 = Math.floor((ry + rh - 1) / T);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        if (this.getTile(tx, ty) === 3) return true;
      }
    }
    return false;
  }

  update(dt) {
    for (const mp of this.movingPlatforms) mp.update(dt);
  }

  render(ctx, camera) {
    // Visible tile range
    const x0 = Math.max(0, Math.floor(camera.x / T) - 1);
    const x1 = Math.min(this.tileW - 1, Math.ceil((camera.x + 960) / T) + 1);
    const y0 = Math.max(0, Math.floor(camera.y / T) - 1);
    const y1 = Math.min(this.tileH - 1, Math.ceil((camera.y + 540) / T) + 1);

    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const tile = this.getTile(tx, ty);
        if (tile === 0) continue;
        const px = tx * T;
        const py = ty * T;

        if (tile === 1) this._drawSolid(ctx, px, py, tx, ty);
        else if (tile === 2) this._drawOneway(ctx, px, py);
        else if (tile === 3) this._drawSpike(ctx, px, py);
      }
    }

    // Moving platforms
    for (const mp of this.movingPlatforms) mp.render(ctx);

    // Exit flag
    if (this.data.exit) this._drawExit(ctx, this.data.exit.tx, this.data.exit.ty);
  }

  _drawSolid(ctx, px, py, tx, ty) {
    // Check if top face exposed
    const topOpen = this.getTile(tx, ty - 1) !== 1;

    // Base fill
    const g = ctx.createLinearGradient(px, py, px, py + T);
    g.addColorStop(0, topOpen ? '#1a4a6a' : '#0f2a3a');
    g.addColorStop(1, '#0a1f2e');
    ctx.fillStyle = g;
    ctx.fillRect(px, py, T, T);

    // Top edge highlight (only if top is exposed)
    if (topOpen) {
      ctx.fillStyle = '#2a7aac';
      ctx.fillRect(px, py, T, 3);
      // Corner cap
      ctx.fillStyle = '#3a9acc';
      ctx.fillRect(px, py, 3, 3);
      ctx.fillRect(px + T - 3, py, 3, 3);
    }

    // Grid line
    ctx.strokeStyle = 'rgba(40,90,130,0.5)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(px, py, T, T);

    // Occasional crystal veins
    if ((tx + ty * 3) % 7 === 0) {
      ctx.strokeStyle = 'rgba(0,180,220,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px + 8, py + 2);
      ctx.lineTo(px + T - 8, py + T - 4);
      ctx.stroke();
    }
  }

  _drawOneway(ctx, px, py) {
    // Semi-transparent energy shelf
    ctx.globalAlpha = 0.85;
    const g = ctx.createLinearGradient(px, py + 6, px, py + T);
    g.addColorStop(0, '#00ff99');
    g.addColorStop(0.3, '#007744');
    g.addColorStop(1, 'rgba(0,50,30,0)');
    ctx.fillStyle = g;
    ctx.fillRect(px, py + 6, T, T - 6);

    ctx.fillStyle = '#66ffbb';
    ctx.fillRect(px, py + 6, T, 3);

    // Pulse dots
    const t = Date.now() * 0.003;
    for (let i = 0; i < 3; i++) {
      const glow = 0.4 + 0.3 * Math.sin(t + i * 2 + px * 0.01);
      ctx.fillStyle = `rgba(200,255,220,${glow})`;
      ctx.beginPath();
      ctx.arc(px + 8 + i * 16, py + 8, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  _drawSpike(ctx, px, py) {
    const count = 3;
    const sw = T / count;
    for (let i = 0; i < count; i++) {
      const sg = ctx.createLinearGradient(px + i * sw, py + 4, px + i * sw + sw/2, py + T);
      sg.addColorStop(0, '#cc1144');
      sg.addColorStop(1, '#440011');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(px + i * sw + 2, py + T);
      ctx.lineTo(px + i * sw + sw / 2, py + 4);
      ctx.lineTo(px + i * sw + sw - 2, py + T);
      ctx.closePath();
      ctx.fill();

      // Edge highlight
      ctx.strokeStyle = '#ff4466';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  _drawExit(ctx, tx, ty) {
    const px = tx * T + T / 2;
    const py = ty * T;
    const t = Date.now() * 0.003;

    // Pole
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(px - 2, py - 60, 4, 60);

    // Flag
    ctx.fillStyle = `hsl(${50 + Math.sin(t) * 15},100%,55%)`;
    ctx.beginPath();
    ctx.moveTo(px + 2, py - 60);
    ctx.lineTo(px + 28, py - 48 + Math.sin(t * 2) * 4);
    ctx.lineTo(px + 2, py - 36);
    ctx.closePath();
    ctx.fill();

    // Glow
    ctx.globalAlpha = 0.3 + 0.15 * Math.sin(t);
    const glow = ctx.createRadialGradient(px, py - 40, 0, px, py - 40, 40);
    glow.addColorStop(0, '#ffcc00');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(px, py - 40, 40, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class UI {
  constructor() {
    this._transAlpha = 0; // for level transition fade
    this._transDir   = 0; // +1 fade in, -1 fade out
  }

  render(ctx, game) {
    switch (game.state) {
      case 'start':    this._drawStart(ctx, game); break;
      case 'playing':  this._drawHUD(ctx, game); break;
      case 'paused':   this._drawHUD(ctx, game); this._drawPause(ctx); break;
      case 'gameover': this._drawHUD(ctx, game); this._drawGameOver(ctx, game); break;
      case 'win':      this._drawHUD(ctx, game); this._drawWin(ctx, game); break;
      case 'transition': this._drawTransition(ctx, game); break;
      case 'bossIntro': this._drawBossIntro(ctx, game); break;
    }
  }

  update(dt, game) {
    if (game.state === 'transition') {
      this._transAlpha += dt * (this._transDir > 0 ? 2.5 : -2.5);
      this._transAlpha = Math.max(0, Math.min(1, this._transAlpha));
    }
  }

  startFadeIn()  { this._transDir = 1; this._transAlpha = 0; }
  startFadeOut() { this._transDir = -1; this._transAlpha = 1; }

  // ── HUD ────────────────────────────────────────────────────────
  _drawHUD(ctx, game) {
    // Background strip
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, 44);

    // Lives
    for (let i = 0; i < 5; i++) {
      const filled = i < game.lives;
      const hx = 14 + i * 28;
      ctx.fillStyle = filled ? '#ff2244' : 'rgba(255,34,68,0.2)';
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('♥', hx, 22);
    }

    // Score
    ctx.fillStyle = '#00ffcc';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${game.score.toString().padStart(7, '0')}`, W / 2, 22);

    // Level name
    ctx.fillStyle = 'rgba(180,200,255,0.7)';
    ctx.font = '12px monospace';
    ctx.fillText(game.level?.data.name || '', W / 2, 38);

    // Active power-ups (new multi-power system)
    const p = game.player;
    if (p) {
      const icons = {
        doubleJump: { label: '✦ JUMP',   color: '#aa44ff', max: 22 },
        rapidFire:  { label: '⚡ RAPID',  color: '#ffaa00', max: 14 },
        shield:     { label: '◈ SHIELD', color: '#44aaff', max: 18 },
        spread:     { label: '✷ SPREAD', color: '#00ff88', max: 16 },
        magnet:     { label: '⊕ MAGNET', color: '#ff44ff', max: 14 },
        speed:      { label: '▶▶ SPEED', color: '#ffee00', max: 10 },
      };
      let row = 0;
      for (const [key, info] of Object.entries(icons)) {
        if (p.power[key] > 0) {
          const frac = Math.min(p.power[key] / info.max, 1);
          const by = 8 + row * 18;
          ctx.textAlign = 'right';
          ctx.fillStyle = info.color;
          ctx.font = 'bold 11px monospace';
          ctx.fillText(info.label, W - 14, by + 6);
          ctx.fillStyle = 'rgba(255,255,255,0.12)';
          ctx.fillRect(W - 86, by + 10, 72, 4);
          ctx.fillStyle = info.color;
          ctx.fillRect(W - 86, by + 10, 72 * frac, 4);
          row++;
        }
      }
    }

    // Style rank meter
    if (game.combo > 1 && game._comboTimer > 0) {
      const ranks      = ['D',       'C',       'B',       'A',       'S',       'SS',      'SSS'];
      const thresh     = [0,          2,          4,          7,         10,        15,        25];
      const rankColors = ['#888888', '#44ff44', '#44aaff', '#aa44ff', '#ffcc00', '#ff8800', '#ff4400'];
      let rank = 0;
      for (let i = thresh.length - 1; i >= 0; i--) {
        if (game.combo >= thresh[i]) { rank = i; break; }
      }
      ctx.save();
      ctx.translate(W - 50, H - 60);
      const scale = 1 + 0.15 * Math.sin(Date.now() * 0.008);
      ctx.scale(scale, scale);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = rankColors[rank];
      ctx.shadowColor = rankColors[rank];
      ctx.shadowBlur = 14;
      ctx.font = `bold ${ranks[rank].length > 1 ? 28 : 36}px monospace`;
      ctx.fillText(ranks[rank], 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Combo multiplier
    if (game.combo > 1 && game._comboTimer > 0) {
      const a = Math.min(game._comboTimer / 0.6, 1);
      const pop = 1 + Math.max(0, (game._comboTimer - 2.3) * 2); // brief pop on gain
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(W / 2, 72);
      ctx.scale(pop, pop);
      ctx.fillStyle = `hsl(${Math.min(40 + game.combo * 10, 140)},100%,60%)`;
      ctx.font = 'bold 24px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 6;
      ctx.fillText(`COMBO  x${game.combo}`, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // Controls hint (first 5 seconds)
    if (game._hintTimer > 0) {
      ctx.globalAlpha = Math.min(game._hintTimer, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, H - 36, W, 36);
      ctx.fillStyle = '#aaccff';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('← → Move   SPACE Jump   Z Shoot   SHIFT Dash   P Pause', W/2, H - 18);
      ctx.globalAlpha = 1;
    }
  }

  // ── Start screen ───────────────────────────────────────────────
  _drawStart(ctx, game) {
    const t = Date.now() * 0.001;

    // Title glow
    ctx.globalAlpha = 0.15 + 0.05 * Math.sin(t * 2);
    const g = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, 300);
    g.addColorStop(0, '#00aaff');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    // Title
    ctx.save();
    ctx.translate(W/2, H/2 - 80 + Math.sin(t * 1.5) * 6);
    const tg = ctx.createLinearGradient(-200, -40, 200, 40);
    tg.addColorStop(0, '#00ffcc');
    tg.addColorStop(0.5, '#00aaff');
    tg.addColorStop(1, '#aa44ff');
    ctx.fillStyle = tg;
    ctx.font = 'bold 72px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#00aaff';
    ctx.shadowBlur = 30;
    ctx.fillText('NEBULA DASH', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    // Subtitle
    ctx.fillStyle = 'rgba(180,220,255,0.8)';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('A COSMIC ADVENTURE', W/2, H/2 - 20);

    // Press to start (blink)
    if (Math.floor(t * 2) % 2 === 0) {
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 20px monospace';
      ctx.fillText('▶  PRESS SPACE TO START  ◀', W/2, H/2 + 40);
    }

    // Controls
    ctx.fillStyle = 'rgba(150,180,220,0.7)';
    ctx.font = '13px monospace';
    ctx.fillText('← → Move   SPACE Jump   Z Shoot   SHIFT Dash   P Pause', W/2, H/2 + 90);

    // Small character preview
    this._drawNovaPrev(ctx, W/2 - 200, H/2 + 20, t);

    // Version
    ctx.fillStyle = 'rgba(100,130,180,0.5)';
    ctx.font = '11px monospace';
    ctx.fillText('3 LEVELS  •  4-PHASE BOSS  •  CHECKPOINTS  •  DASH', W/2, H - 20);
  }

  _drawNovaPrev(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(0.7, 0.7);
    // Simple silhouette
    const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 36);
    glow.addColorStop(0, 'rgba(0,220,255,0.3)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00ccee';
    ctx.beginPath(); ctx.roundRect(-18, -22, 36, 44, 8); ctx.fill();
    ctx.fillStyle = '#00aabb';
    ctx.beginPath(); ctx.arc(0, -26, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(5, -28, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ── Pause screen ───────────────────────────────────────────────
  _drawPause(ctx) {
    ctx.fillStyle = 'rgba(0,5,20,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#00ffcc';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 20;
    ctx.fillText('PAUSED', W/2, H/2 - 20);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(180,220,255,0.7)';
    ctx.font = '18px monospace';
    ctx.fillText('Press P or ESC to resume', W/2, H/2 + 40);
  }

  // ── Game over ──────────────────────────────────────────────────
  _drawGameOver(ctx, game) {
    const t = Date.now() * 0.001;
    ctx.fillStyle = 'rgba(20,0,5,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W/2, H/2 - 40 + Math.sin(t) * 4);
    const g = ctx.createLinearGradient(-200, -30, 200, 30);
    g.addColorStop(0, '#ff2244');
    g.addColorStop(1, '#ff6600');
    ctx.fillStyle = g;
    ctx.font = 'bold 64px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff2244';
    ctx.shadowBlur = 25;
    ctx.fillText('GAME OVER', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.fillStyle = '#00ffcc';
    ctx.font = '22px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`Score: ${game.score}`, W/2, H/2 + 30);

    if (Math.floor(t * 2) % 2 === 0) {
      ctx.fillStyle = 'rgba(200,220,255,0.9)';
      ctx.font = '18px monospace';
      ctx.fillText('Press SPACE to retry', W/2, H/2 + 75);
    }
  }

  // ── Win / Victory ──────────────────────────────────────────────
  _drawWin(ctx, game) {
    const t = Date.now() * 0.001;
    ctx.fillStyle = 'rgba(0,5,10,0.75)';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W/2, H/2 - 60 + Math.sin(t * 1.2) * 5);
    const g = ctx.createLinearGradient(-250, -40, 250, 40);
    g.addColorStop(0, '#00ffcc');
    g.addColorStop(0.5, '#44aaff');
    g.addColorStop(1, '#aa44ff');
    ctx.fillStyle = g;
    ctx.font = 'bold 56px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 30;
    ctx.fillText('VICTORY!', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.fillStyle = '#ffcc00';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('The galaxy is saved!', W/2, H/2 - 4);

    ctx.fillStyle = '#00ffcc';
    ctx.font = '24px monospace';
    ctx.fillText(`Final Score: ${game.score}`, W/2, H/2 + 34);

    // Stars cascade
    for (let i = 0; i < 5; i++) {
      const sx = W/2 - 80 + i * 40;
      ctx.fillStyle = '#ffdd00';
      ctx.font = '28px sans-serif';
      ctx.fillText('★', sx, H/2 + 75);
    }

    if (Math.floor(t * 2) % 2 === 0) {
      ctx.fillStyle = 'rgba(200,220,255,0.9)';
      ctx.font = '16px monospace';
      ctx.fillText('Press SPACE to return to menu', W/2, H/2 + 120);
    }
  }

  // ── Level transition ───────────────────────────────────────────
  _drawTransition(ctx, game) {
    this._drawHUD(ctx, game);
    ctx.fillStyle = `rgba(0,5,20,${this._transAlpha})`;
    ctx.fillRect(0, 0, W, H);

    if (this._transAlpha > 0.5) {
      const next = game._nextLevelName || '';
      ctx.fillStyle = `rgba(0,255,200,${(this._transAlpha - 0.5) * 2})`;
      ctx.font = 'bold 36px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`Level ${game.currentLevelIndex + 1}: ${next}`, W/2, H/2);
    }
  }

  // ── Boss intro ────────────────────────────────────────────────
  _drawBossIntro(ctx, game) {
    this._drawHUD(ctx, game);
    const t = Date.now() * 0.001;
    ctx.fillStyle = `rgba(20,0,0,${0.5 + 0.2 * Math.sin(t * 8)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff2200';
    ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur = 20;
    ctx.fillText('⚠  BOSS APPROACHING  ⚠', W/2, H/2);
    ctx.shadowBlur = 0;
  }
}


// ===================== Game.js =====================












class Game {
  constructor(canvas) {
    this.canvas  = canvas;
    this.ctx     = canvas.getContext('2d');
    this.input   = new Input();
    this.audio   = new Audio();
    this.camera  = new Camera();
    this.particles = new ParticleSystem();
    this.bg      = new Background();
    this.ui      = new UI();

    this.state   = 'start';
    this.lives   = PLAYER_LIVES;
    this.score   = 0;
    this.currentLevelIndex = 0;

    this.level        = null;
    this.player       = null;
    this.enemies      = [];
    this.projectiles  = [];
    this.collectibles = [];
    this.boss         = null;
    this.checkpoints  = [];

    this._spawnX   = 0;
    this._spawnY   = 0;
    this._time     = 0;
    this._hintTimer = 0;

    this._transTimer  = 0;
    this._nextLevelName = '';
    this._audioInit   = false;

    this._bossIntroTimer = 0;
    this._wonLevel = false;

    // ── Juice state ──────────────────────────────────────────────
    this._hitStop    = 0;
    this._flashAlpha = 0;
    this._flashColor = '#ffffff';
    this.combo       = 0;
    this._comboTimer = 0;
    this.floaters    = [];
    this._ambientTimer = 0;
    this._slowMo     = 1.0;    // slow-motion multiplier (1 = normal)
  }

  // ── Juice helpers ──────────────────────────────────────────────
  hitStop(t)        { this._hitStop = Math.max(this._hitStop, t); }
  flash(color, a)   { this._flashColor = color; this._flashAlpha = Math.max(this._flashAlpha, a); }
  addFloater(x, y, text, color) {
    this.floaters.push({ x, y, text, color, life: 0.9, max: 0.9 });
    if (this.floaters.length > 40) this.floaters.shift();
  }

  // Register a kill: applies combo multiplier, score, popup, juice
  addKill(base, x, y, color) {
    this.combo = Math.min(this.combo + 1, 99);
    this._comboTimer = 2.5;
    const pts = base * this.combo;
    this.score += pts;
    this.addFloater(x, y, (this.combo > 1 ? `x${this.combo} ` : '') + `+${pts}`, color);
    this.hitStop(0.06);
    this.flash(color, 0.22);
  }

  _ensureAudio() {
    if (!this._audioInit) {
      this.audio.init();
      this._audioInit = true;
    }
    this.audio.resume();
  }

  start() {
    // Check for saved checkpoint
    const cp = loadCheckpoint();
    if (cp && cp.levelIndex < ALL_LEVELS.length) {
      this.lives = cp.lives || PLAYER_LIVES;
      this.score = cp.score || 0;
      this.currentLevelIndex = cp.levelIndex;
      this.audio.stopMusic();
      this._loadLevel(cp.levelIndex);
      this.state = 'playing';
    } else {
      this.lives = PLAYER_LIVES;
      this.score = 0;
      this.currentLevelIndex = 0;
      this.audio.stopMusic();
      this._loadLevel(0);
      this.state = 'playing';
    }
    this._hintTimer = 8;
    this._slowMo = 1.0;
  }

  _loadLevel(index) {
    const data = ALL_LEVELS[index];
    this.level  = new Level(data);
    const { enemies, collectibles, boss, checkpoints } = Level.buildEntities(data);
    this.enemies      = enemies;
    this.collectibles = collectibles;
    this.boss         = boss;
    this.checkpoints  = checkpoints;
    this.projectiles  = [];

    const sp = data.playerStart;
    this._spawnX = sp.tx * T;
    this._spawnY = (sp.ty + 1) * T - 44;
    this.player  = new Player(sp.tx, sp.ty);

    this.camera.x  = 0;
    this.camera.y  = 0;
    this.camera._tx = 0;
    this.camera._ty = 0;

    this.particles = new ParticleSystem();
    this._wonLevel = false;
    this.floaters  = [];
    this.combo     = 0;
    this._comboTimer = 0;
    this._hitStop  = 0;
    this._flashAlpha = 0;

    // If boss level, show intro sequence then start music
    if (boss) {
      this._bossIntroTimer = 0;
      this.state = 'bossIntro';
      setTimeout(() => {
        if (this.state === 'bossIntro') {
          this.state = 'playing';
          this.audio.startMusic(data.musicTheme);
        }
      }, 3000);
    } else {
      this.audio.startMusic(data.musicTheme);
    }
  }

  update(dt) {
    const inp = this.input;
    this._time += dt;

    // Flash always decays so it fades even on game-over/win
    if (this._flashAlpha > 0) this._flashAlpha = Math.max(0, this._flashAlpha - dt * 5);

    this.ui.update(dt, this);

    switch (this.state) {
      case 'start':
        if (inp.confirm()) {
          this._ensureAudio();
          this.start();
        }
        break;

      case 'bossIntro':
        // Music started in _loadLevel; just wait for intro timer
        break;

      case 'playing':
        if (inp.pause()) { this.state = 'paused'; break; }
        this._hintTimer = Math.max(0, this._hintTimer - dt);
        this._updatePlaying(dt);
        break;

      case 'paused':
        if (inp.pause() || inp.confirm()) this.state = 'playing';
        break;

      case 'gameover':
        if (inp.confirm()) {
          this._ensureAudio();
          this.start();
        }
        break;

      case 'win':
        if (inp.confirm()) {
          this.audio.stopMusic();
          this.state = 'start';
        }
        break;

      case 'transition':
        this._transTimer -= dt;
        if (this._transTimer <= 0) {
          this.state = 'playing';
          this.audio.startMusic(ALL_LEVELS[this.currentLevelIndex].musicTheme);
        }
        break;
    }

    inp.clearFrame();
  }

  _updatePlaying(dt) {
    const level = this.level;

    // Slow-motion: recover back toward 1.0 over ~2s
    if (this._slowMo < 1.0) {
      this._slowMo = Math.min(1.0, this._slowMo + dt * 0.5);
    }
    dt *= this._slowMo;

    // Hit-stop: freeze the world briefly for punchy impacts.
    if (this._hitStop > 0) {
      this._hitStop -= dt;
      this.camera.update(dt);
      return;
    }

    // Combo decay
    if (this._comboTimer > 0) {
      this._comboTimer -= dt;
      if (this._comboTimer <= 0) this.combo = 0;
    }

    // Floating score popups
    for (const f of this.floaters) { f.y -= 45 * dt; f.life -= dt; }
    this.floaters = this.floaters.filter(f => f.life > 0);

    // Ambient drifting motes within the camera view
    this._ambientTimer -= dt;
    if (this._ambientTimer <= 0) {
      this._ambientTimer = 0.12;
      this.particles.ambientMote(
        this.camera.x + Math.random() * W,
        this.camera.y + Math.random() * H
      );
    }

    // Update level (moving platforms)
    level.update(dt);

    // Player
    this.player.update(dt, this);

    if (this.player.dead) {
      this._onPlayerDead();
      return;
    }

    // Spike check
    if (level.spikeAt(this.player.x, this.player.y, this.player.w, this.player.h)) {
      this.player.hurt(this);
    }

    // Enemies
    for (const e of this.enemies) {
      if (!e.dead) e.update(dt, this);
    }
    this.enemies = this.enemies.filter(e => !e.dead);

    // Boss
    if (this.boss && !this.boss.dead) {
      this.boss.update(dt, this);
    }

    // Projectiles
    for (const p of this.projectiles) p.update(dt, this);
    this.projectiles = this.projectiles.filter(p => !p.dead);

    // Collectibles
    for (const c of this.collectibles) {
      if (!c.dead) c.update(dt, this);
    }
    this.collectibles = this.collectibles.filter(c => !c.dead);

    // Checkpoints
    for (const cp of this.checkpoints) cp.update(dt, this);

    // Particles
    this.particles.update(dt);

    // Camera
    this.camera.follow(this.player, level.worldW, level.worldH);
    this.camera.update(dt);

    // Exit check (non-boss levels) — generous hitbox on the flag pole
    if (!this._wonLevel && level.data.exit) {
      const ex = level.exitX;
      const ey = level.exitY;
      const p = this.player;
      if (Math.abs(p.x + p.w / 2 - ex) < T * 1.5 && p.grounded) {
        this._wonLevel = true;
        this._levelComplete();
      }
    }
  }

  _onPlayerDead() {
    if (this.lives <= 0) {
      this.audio.stopMusic();
      this.audio.gameOver();
      this.state = 'gameover';
    } else {
      // Respawn at checkpoint without reloading level
      this.player = new Player(0, 0);
      this.player.x = this._spawnX;
      this.player.y = this._spawnY;
      if (!this.audio._musicPlaying) {
        this.audio.startMusic(ALL_LEVELS[this.currentLevelIndex].musicTheme);
      }
    }
  }

  _levelComplete() {
    this.audio.levelComplete();
    this.audio.stopMusic();
    this.score += 500;

    const nextIndex = this.currentLevelIndex + 1;
    if (nextIndex >= ALL_LEVELS.length) {
      // All levels done
      setTimeout(() => { this.state = 'win'; this.audio.levelComplete(); }, 1000);
      return;
    }

    // Transition to next level
    this.state = 'transition';
    this.ui.startFadeIn();
    this._nextLevelName = ALL_LEVELS[nextIndex].name;
    this._transTimer = 2.0;

    setTimeout(() => {
      this.currentLevelIndex = nextIndex;
      this._loadLevel(nextIndex);
      this.ui.startFadeOut();
      if (this.state !== 'bossIntro') this.state = 'transition';
      this._transTimer = 1.5;
    }, 1000);
  }

  triggerWin() {
    this._wonLevel = true;
    clearCheckpoint(); // game beaten — wipe the save
    setTimeout(() => {
      this.state = 'win';
      this.audio.stopMusic();
      this.audio.levelComplete();
    }, 600);
  }

  render() {
    const ctx  = this.ctx;
    const cam  = this.camera;

    ctx.clearRect(0, 0, W, H);

    // Background (no camera transform)
    const bgTheme = this.level ? this.level.data.bgTheme : 0;
    this.bg.render(ctx, cam, this.level ? this.level.worldW : W, bgTheme, this._time);

    if (this.state === 'start' || this.state === 'gameover' || this.state === 'win') {
      this.ui.render(ctx, this);
      return;
    }

    // World-space rendering
    ctx.save();
    cam.apply(ctx);

    // Level tiles
    this.level.render(ctx, cam);

    // Checkpoints (behind everything)
    for (const cp of this.checkpoints) cp.render(ctx);

    // Collectibles
    for (const c of this.collectibles) if (!c.dead) c.render(ctx);

    // Particles (behind entities)
    this.particles.renderBehind(ctx);

    // Enemies
    for (const e of this.enemies) if (!e.dead) e.render(ctx);

    // Boss
    if (this.boss && !this.boss.dead) this.boss.render(ctx);

    // Projectiles
    for (const p of this.projectiles) if (!p.dead) p.render(ctx);

    // Player
    if (this.player) this.player.render(ctx);

    // Particles (front)
    this.particles.renderFront(ctx);

    // Floating score popups (world space, above everything)
    for (const f of this.floaters) {
      const a = Math.min(f.life / f.max, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color;
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 4;
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // ── Post-processing (screen space) ───────────────────────────
    // Vignette for depth
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,12,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // Impact flash
    if (this._flashAlpha > 0) {
      ctx.globalAlpha = this._flashAlpha;
      ctx.fillStyle = this._flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // UI overlay (screen space)
    this.ui.render(ctx, this);
  }
}


// ===================== main.js =====================



// ── Canvas setup & scaling ────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
canvas.width  = W;
canvas.height = H;

function resize() {
  const scaleX = window.innerWidth  / W;
  const scaleY = window.innerHeight / H;
  const scale  = Math.min(scaleX, scaleY);
  canvas.style.width  = `${W * scale}px`;
  canvas.style.height = `${H * scale}px`;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

// ── Game loop ─────────────────────────────────────────────────────────────
const game = new Game(canvas);
// Expose for debugging / automated smoke tests
if (typeof window !== 'undefined') window.NebulaGame = game;

// On touch devices, tapping anywhere on a menu/result screen confirms.
// (During play, the on-screen buttons handle input instead.)
canvas.addEventListener('touchstart', e => {
  if (game.state !== 'playing' && game.state !== 'paused') {
    game.input._confirmTap = true;
    e.preventDefault();
  }
}, { passive: false });

let lastTime = 0;
const MAX_DT  = 1 / 30; // cap delta at ~30fps to prevent spiral of death

function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, MAX_DT);
  lastTime = timestamp;

  game.update(dt);
  game.render();

  requestAnimationFrame(loop);
}

requestAnimationFrame(ts => {
  lastTime = ts;
  requestAnimationFrame(loop);
});


})();
</script>
